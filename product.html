<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>شراب نانو الفضة لمرضى السكري — دودليزا</title>
<meta name="description" content="حافة واسعة لا تضغط، بامبو يتنفس، نانو الفضة — علبة + علبة مجانًا بـ 145 ر.س">
<link rel="icon" href="img/logo.webp">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&amp;family=Montserrat:wght@500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#FFFFFF}
a{color:#2B1B22}
@keyframes lp-marquee{from{transform:translateX(0)}to{transform:translateX(-50%)}}
@keyframes lp-fade{from{opacity:.35}to{opacity:1}}
@keyframes lp-in{from{transform:translateX(-100%)}to{transform:translateX(0)}}
.lp-track{animation:lp-marquee 70s linear infinite}
.lp-track:hover,.lp-track-rev:hover{animation-play-state:paused}
@keyframes lp-marquee-rev{from{transform:translateX(-50%)}to{transform:translateX(0)}}
.lp-track-rev{animation:lp-marquee-rev 50s linear infinite}
.lp-fade{animation:lp-fade .6s ease}
.lp-drawer{animation:lp-in .3s ease}
.lat{font-family:'Montserrat',sans-serif;letter-spacing:2px;text-transform:uppercase}
.pdp{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);grid-template-areas:"media info";gap:36px;align-items:start;max-width:1120px;margin:0 auto}
.main-img{aspect-ratio:1/1 !important;max-height:calc(100vh - 250px);min-height:420px}
.pdp-head-d h1{font-size:24px !important}
.pdp-info{gap:12px !important}
.pdp-media{grid-area:media}.pdp-info{grid-area:info}
.pdp-media{position:sticky;top:70px}
.pdp-head-m{display:none;flex-direction:column;gap:2px}
.pdp-head-d{display:flex;flex-direction:column;gap:6px}
.feat{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:48px;align-items:center}
.feat-rev .feat-img{order:2}
.rel{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
.hl{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px}
.trust{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;padding:4px 0}
@media (max-width: 860px){
  .pdp{grid-template-columns:minmax(0,1fr);grid-template-areas:"media" "info";gap:14px}
  .pdp-info{position:static}
  .pdp-media{position:static}
  .pdp-head-m{display:flex}
  .pdp-head-d{display:none}
  .main-img{aspect-ratio:auto !important;height:29vh;max-height:none;min-height:0;width:auto;margin:0 -20px}
  .thumbs{gap:6px !important}
  .crumb{display:none !important}
  .feat{grid-template-columns:minmax(0,1fr);gap:18px}
  .feat-rev .feat-img{order:0}
  .rel{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .hl{grid-template-columns:repeat(3,minmax(0,1fr));gap:16px 8px}
}
.rv-avg{font-size:22px}
.rv-h2{font-size:18px}
.rv-card{width:280px;padding:12px;flex-direction:column;gap:8px}
.rv-body{display:flex;gap:12px;align-items:flex-start}
.rv-pics{display:flex;gap:6px;flex-shrink:0}
.rv-pics img{width:56px;height:56px}
.rv-pics img:nth-child(n+2){display:none}
.rv-bars{display:none !important}
.rv-head{flex-wrap:nowrap !important;gap:10px !important}
.rv-sum{padding:8px 12px !important;gap:10px !important;border-radius:10px !important}
.rv-text{font-size:13px;line-height:1.6}
@media (max-width: 860px){
  .cmp{font-size:12px !important}
  .cmp th,.cmp td,.cmp span{padding:9px 6px !important;line-height:1.45}
  .rv-sum{padding:8px 12px !important;gap:10px !important;border-radius:10px !important}
  .rv-bars{display:none !important}
  .rv-head{flex-wrap:nowrap !important;gap:10px !important;margin-bottom:14px !important}
  .rv-avg{font-size:22px}
  .rv-h2{font-size:20px}
  .rv-card{width:280px;padding:12px;gap:8px}
  .rv-pics img{width:56px;height:56px}
  .rv-pics img:nth-child(n+2){display:none}
  .rv-text{font-size:13px;line-height:1.6}
}
.why-box{display:grid;grid-template-columns:1fr 1fr;gap:28px;align-items:stretch}
.why-img{position:relative;overflow:hidden;min-height:520px;border-radius:18px;background:#F3E3E7;box-shadow:0 18px 45px rgba(43,27,34,0.08)}
@keyframes why-breath{from{transform:scale(1)}to{transform:scale(1.06)}}
.why-img img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:opacity .7s ease;animation:why-breath 8s ease-in-out infinite alternate}
.why-panel{background:#FFFFFF;border:1px solid rgba(43,27,34,0.06);border-radius:18px;box-shadow:0 18px 45px rgba(43,27,34,0.06);padding:8px 22px 18px}
.why-it{position:relative;width:100%;display:grid;grid-template-columns:40px 46px minmax(0,1fr);gap:14px;align-items:center;padding:16px 14px;border:0;border-bottom:1px solid rgba(43,27,34,0.07);background:transparent;cursor:pointer;font-family:inherit;color:#2B1B22;text-align:right;transition:background .35s}
.why-it:last-of-type{border-bottom:0}
.why-it:hover{background:rgba(194,48,75,0.03)}
.why-line{position:absolute;right:-22px;top:12px;bottom:12px;width:4px;border-radius:10px;background:#C2304B;opacity:0;transform:scaleY(.3);transition:opacity .45s,transform .45s}
.why-num{font-family:'Montserrat',sans-serif;font-weight:700;font-size:17px;color:rgba(43,27,34,0.18);transition:color .35s}
.why-ic{width:42px;height:42px;border-radius:13px;display:flex;align-items:center;justify-content:center;background:#FDEEF1;color:#C2304B;transition:all .4s}
.why-txt{display:flex;flex-direction:column;gap:3px;min-width:0}
.why-txt strong{font-size:16px;font-weight:800;transition:color .35s}
.why-txt span{font-size:13px;color:#6B5A61;line-height:1.7}
.why-on{background:linear-gradient(90deg,rgba(194,48,75,0.02),rgba(194,48,75,0.07))}
.why-on .why-line{opacity:1;transform:scaleY(1)}
.why-on .why-num{color:#C2304B}
.why-on .why-ic{background:#C2304B;color:#FFFFFF;transform:translateY(-2px) scale(1.06);box-shadow:0 8px 22px rgba(194,48,75,0.25)}
.why-on .why-txt strong{color:#C2304B}
@media (max-width: 860px){
  .why-box{grid-template-columns:minmax(0,1fr);gap:16px}
  .why-img{min-height:320px}
  .why-panel{padding:4px 12px 14px}
  .why-it{grid-template-columns:30px 40px minmax(0,1fr);gap:10px;padding:13px 8px}
  .why-line{right:-12px}
  .why-ic{width:38px;height:38px}
  .why-txt strong{font-size:14px}
  .why-txt span{font-size:12px}
}
.ann-t{font-size:16px;font-weight:800}
@media (max-width: 860px){.ann{gap:8px !important;padding:6px 8px !important;flex-wrap:nowrap !important}.ann-t{font-size:12px}.ann span[style*="min-width: 40px"]{min-width:30px !important}}
.rv-wide{display:none}
@media (min-width: 861px){
  .rv-narrow{display:none !important}
  .rv-wide{display:block}
  .rv-wide .rv-card{width:340px;padding:16px;gap:10px}
  .rv-wide .rv-pics img{width:72px;height:72px}
  .rv-wide .rv-pics img:nth-child(n+2){display:block}
  .rv-wide .rv-bars{display:flex !important}
  .rv-wide .rv-avg{font-size:32px}
  .rv-wide .rv-h2{font-size:28px}
  .rv-wide .rv-text{font-size:14px}
}
.opts{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:14px;align-items:start}
@media (max-width: 860px){.perpair{display:none !important}.opts{gap:10px}.opts button[aria-label]{width:34px !important;height:34px !important}}
.was-wrap{color:#7A6870;font-weight:600;white-space:nowrap;line-height:1.5}
.was{position:relative;display:inline-block;color:#4A3A41;font-weight:800;padding:0 2px}
.was::after{content:"";position:absolute;left:-3px;right:-3px;top:50%;height:2px;background:#E15169;border-radius:2px;transform:rotate(-14deg)}
.now{display:inline-block;background:#C2304B;color:#FFFFFF;font-weight:800;border-radius:10px;padding:2px 12px;line-height:1.5}
.now-s{display:inline-block;background:#FDEEF1;color:#C2304B;font-weight:800;border-radius:8px;padding:1px 10px;line-height:1.5}
button[aria-pressed="true"] .now-s{background:#C2304B;color:#FFFFFF}
.ib-step{display:grid;grid-template-columns:56px 1fr 56px;height:48px;border:1.5px solid #EADFE2}
.ib-step button{border:0;background:#FFFFFF;cursor:pointer;font-size:24px;line-height:1;color:#2B1B22;font-family:inherit}
.ib-step strong{display:flex;align-items:center;justify-content:center;border-right:1.5px solid #EADFE2;border-left:1.5px solid #EADFE2;font-family:'Montserrat',sans-serif;font-size:17px}
.ib-btns{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.ib-btns > *{height:50px;display:flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;border-radius:0;cursor:pointer;font-family:inherit;padding:0}
.ib-cart{background:#C2304B;color:#FFFFFF;border:0}
.ib-now{background:#FFFFFF;color:#2B1B22 !important;border:1.5px solid #2B1B22;font-size:15px;font-weight:800}
.ib-ap{background:#000000;color:#FFFFFF !important;font-family:-apple-system,'Helvetica Neue',Arial,sans-serif !important;font-size:18px;font-weight:600;letter-spacing:-0.3px}
@supports (-webkit-appearance: -apple-pay-button){
  .ib-ap{-webkit-appearance:-apple-pay-button;-apple-pay-button-type:plain;-apple-pay-button-style:black;font-size:0 !important;color:transparent !important;border-radius:0}
}
@media (max-width: 860px){.ib-inline{display:none !important}}
@media (min-width: 861px){.ib-sticky{display:none !important}}
@media (prefers-reduced-motion: reduce){.why-img img{animation:none}}
@media (prefers-reduced-motion: reduce){.lp-track,.lp-track-rev,.lp-fade,.lp-drawer{animation:none}}
details summary{cursor:pointer;list-style:none}
details summary::-webkit-details-marker{display:none}
</style>

<style>html{scroll-behavior:smooth}</style>
</head>
<body>
<div id="app"></div>
<template id="tpl">

<div dir="rtl" style="font-family: 'Cairo', sans-serif; color: #2B1B22; background: #FFFFFF; line-height: 1.7">

  <div class="ann" style="background: #C2304B; color: #FFFFFF; display: flex; align-items: center; justify-content: center; gap: 14px; flex-wrap: wrap; padding: 10px 14px">
    <div style="display: flex; flex-direction: column; line-height: 1.3; text-align: center">
      <strong class="ann-t">علبة + علبة مجانًا · {{p1}} ر.س بس</strong>
      <span style="font-size: 11px; opacity: 0.9">العرض ينتهي خلال</span>
    </div>
    <div dir="ltr" style="display: flex; gap: 5px">
      <sc-for list="{{clock}}" as="k" hint-placeholder-count="4">
        <span style="min-width: 40px; background: rgba(255,255,255,0.16); border: 1px solid rgba(255,255,255,0.3); border-radius: 8px; padding: 3px 4px; display: flex; flex-direction: column; align-items: center; line-height: 1.15"><strong style="font-family: 'Montserrat', sans-serif; font-size: 16px">{{k.v}}</strong><span style="font-size: 9px; opacity: 0.9">{{k.l}}</span></span>
      </sc-for>
    </div>
  </div>

  <header style="position: sticky; top: 0; z-index: 10; background: rgba(255,255,255,0.97); border-bottom: 1px solid #F3E3E7">
    <div style="max-width: 1280px; margin: 0 auto; padding: 12px 20px; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center">
      <button type="button" aria-label="القائمة" style="justify-self: start; border: 0; background: transparent; padding: 6px; cursor: pointer; display: flex"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#2B1B22" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><path d="M3 7h18M3 12h18M3 17h18"></path></svg></button>
      <a href="index.html" aria-label="دودليزا — الرئيسية" style="display: flex"><img src="img/logo.webp" alt="دودليزا" style="height: 34px; width: auto; display: block"></a>
      <button type="button" onClick="{{openCart}}" style="justify-self: end; border: 0; background: transparent; cursor: pointer; font-family: inherit; font-size: 13px; font-weight: 700; padding: 6px">السلة ({{cart}})</button>
    </div>
  </header>

  <!-- ================= PDP TOP ================= -->
  <section id="buy" style="max-width: 1280px; margin: 0 auto; padding: 14px 20px 36px; scroll-margin-top: 70px">
    <nav aria-label="مسار الصفحة" class="crumb" style="max-width: 1120px; margin: 0 auto 12px; display: flex; gap: 8px; align-items: center; font-size: 13px; color: #7A6870"><a href="index.html" style="color: #7A6870; text-decoration: none">الرئيسية</a><span aria-hidden="true">›</span><span style="color: #2B1B22; font-weight: 700">شراب مرضى السكري</span></nav>
    <div class="pdp">

      <div class="pdp-media" style="display: flex; flex-direction: column; gap: 10px">
        <div class="pdp-head-m">
          <h1 style="margin: 0; font-size: 18px; font-weight: 800; line-height: 1.45">شراب نانو الفضة لمرضى السكري — {{genderLabel}}</h1>
        </div>

        <div class="main-img" style="position: relative; aspect-ratio: 4 / 5; background: #FBF1F3; overflow: hidden">
          <div dir="ltr" onTouchStart="{{tStart}}" onTouchEnd="{{tEnd}}" style="{{carTrack}}">
            <sc-for list="{{thumbs}}" as="im" hint-placeholder-count="8">
              <img data-dc-src="{{im.src}}" alt="{{im.alt}}" draggable="false" style="flex: 0 0 100%; width: 100%; height: 100%; object-fit: cover; display: block">
            </sc-for>
          </div>
          <span style="position: absolute; top: 10px; right: 10px; background: #C2304B; color: #FFFFFF; font-size: 11px; font-weight: 700; padding: 3px 10px">1 + 1 مجانًا</span>
          <button type="button" onClick="{{prev}}" aria-label="الصورة السابقة" style="position: absolute; top: 50%; right: 8px; transform: translateY(-50%); width: 40px; height: 40px; border-radius: 999px; border: 0; background: rgba(255,255,255,0.9); cursor: pointer; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#2B1B22" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18l6-6-6-6"></path></svg></button>
          <button type="button" onClick="{{next}}" aria-label="الصورة التالية" style="position: absolute; top: 50%; left: 8px; transform: translateY(-50%); width: 40px; height: 40px; border-radius: 999px; border: 0; background: rgba(255,255,255,0.9); cursor: pointer; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#2B1B22" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg></button>
          <div style="position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; gap: 5px">
            <sc-for list="{{thumbs}}" as="d" hint-placeholder-count="8"><span style="{{d.dot}}"></span></sc-for>
          </div>
        </div>
        <div class="thumbs" style="display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); gap: 6px">
          <sc-for list="{{thumbs}}" as="t" hint-placeholder-count="8">
            <button type="button" onClick="{{t.pick}}" aria-label="{{t.alt}}" style="{{t.style}}"><img data-dc-src="{{t.src}}" alt="" style="width: 100%; height: 100%; object-fit: cover; display: block; border-radius: 7px"></button>
          </sc-for>
        </div>
      </div>

      <div class="pdp-info" style="display: flex; flex-direction: column; gap: 14px">
        <div class="pdp-head-d">
          <span class="lat" style="font-size: 10px; color: #7A6870">Bamboo · Nano Silver</span>
          <h1 style="margin: 0; font-size: 26px; font-weight: 800; line-height: 1.45">شراب نانو الفضة لمرضى السكري — {{genderLabel}}</h1>
          <span style="font-size: 13px; color: #6B5A61"><span style="color: #E15169">★★★★★</span> [التقييم] · [عدد] تقييم</span>
        </div>

        <!-- BUNDLE PICKER -->
        <fieldset style="border: 0; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px">
          <legend style="font-size: 13px; font-weight: 800; padding: 0 0 12px">اختر العرض <span style="font-weight: 500; color: #7A6870">· كل علبة 5 أزواج</span></legend>
          <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
            <sc-for list="{{bundles}}" as="x" hint-placeholder-count="3">
              <button type="button" onClick="{{x.pick}}" aria-pressed="{{x.pressed}}" style="{{x.tile}}">
                <sc-if value="{{x.hasTag}}" hint-placeholder-val="{{true}}"><span style="{{x.tagStyle}}">{{x.tag}}</span></sc-if>
                <strong style="font-family: 'Montserrat', sans-serif; font-size: 20px; line-height: 1.1" dir="ltr">{{x.short}}</strong>
                <span style="font-size: 11px; color: #7A6870">{{x.pairs}} زوج</span>
                <span class="was-wrap" style="font-size: 12px; margin-top: 6px">بدل <span class="was">{{x.old}}</span></span>
                <strong class="now-s" style="font-size: 16px; margin-top: 4px">{{x.price}} ر.س</strong>
              </button>
            </sc-for>
          </div>
          <div class="perpair" style="display: flex; justify-content: center; gap: 6px; font-size: 12px; color: #4A3A41; background: #FDF4F6; border-radius: 8px; padding: 7px 10px">
            <span>سعر الزوج <strong>{{b.per}} ر.س</strong></span><span aria-hidden="true">·</span><span style="color: #C2304B; font-weight: 700">توفّر {{b.save}} ر.س</span><span aria-hidden="true">·</span><span>{{b.ship}}</span><span aria-hidden="true">·</span><span>Free Size</span>
          </div>
        </fieldset>

        <!-- OPTIONS (asked as questions, above CTA) -->
        <div class="opts">
          <div style="display: flex; flex-direction: column; gap: 6px; min-width: 0">
            <span style="font-size: 13px; font-weight: 800">رجالي ولا نسائي؟</span>
            <div style="display: flex; gap: 6px">
              <sc-for list="{{genders}}" as="g" hint-placeholder-count="2">
                <button type="button" onClick="{{g.pick}}" aria-pressed="{{g.pressed}}" style="{{g.style}}">{{g.label}}</button>
              </sc-for>
            </div>
          </div>
          <div style="display: flex; flex-direction: column; gap: 6px; min-width: 0">
            <span style="font-size: 13px; font-weight: 800">وش اللون؟ <span style="font-weight: 500; color: #6B5A61">{{colorName}}</span></span>
            <div style="display: flex; gap: 6px">
              <sc-for list="{{colors}}" as="c" hint-placeholder-count="4">
                <button type="button" onClick="{{c.pick}}" aria-label="{{c.name}}" aria-pressed="{{c.pressed}}" style="{{c.style}}"><span style="{{c.sw}}"></span></button>
              </sc-for>
            </div>
          </div>
        </div>

        <!-- CTAs -->
        <div style="display: flex; flex-direction: column; gap: 8px">
          <div class="ib-inline">
      <div class="ib-btns">
        <button type="button" onClick="{{add}}" aria-label="أضف إلى السلة" class="ib-cart"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 4h2l2.2 10.2a1.5 1.5 0 0 0 1.5 1.2h8.6a1.5 1.5 0 0 0 1.5-1.1L20.5 8H6.2M9.5 20a1 1 0 1 0 0-2a1 1 0 1 0 0 2zM17 20a1 1 0 1 0 0-2a1 1 0 1 0 0 2z"></path></svg></button>
        <a href="#buy" class="ib-now"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h14a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H4zM4 7l11-3v3M16 12.5h4v3h-4z"></path></svg>اشترِ الآن</a>
        <a href="#buy" aria-label="الدفع عبر Apple Pay" class="ib-ap" dir="ltr">Apple Pay</a>
      </div>
          </div>
          <span style="text-align: center; font-size: 12px; color: #6B5A61">أو 4 دفعات <strong style="color: #2B1B22">{{b.inst}} ر.س</strong> مع تابي وتمارا · بدون فوائد</span>
        </div>

        <!-- Trust row -->
        <div class="trust">
          <sc-for list="{{trust}}" as="tr" hint-placeholder-count="4">
            <div style="display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center">
              <span style="width: 44px; height: 44px; border-radius: 999px; background: #FDF4F6; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#2B1B22" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path data-dc-d="{{tr.d}}"></path></svg></span>
              <span style="font-size: 11px; font-weight: 700; line-height: 1.35">{{tr.t}}</span>
            </div>
          </sc-for>
        </div>

        <!-- ================= TESTIMONIALS STRIP ================= -->
        <section class="rv-sec rv-narrow" aria-label="تقييمات العملاء" style="background: #FDF4F6; border-radius: 14px; padding: 16px 0 12px; overflow: hidden">
          <div class="rv-head" style="margin: 0 0 12px; padding: 0 14px; display: flex; flex-wrap: wrap; gap: 24px; align-items: center; justify-content: space-between">
            <div style="display: flex; flex-direction: column; gap: 4px">
